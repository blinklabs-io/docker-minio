name: "publish"

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*

permissions:
  attestations: write
  contents: write
  id-token: write
  packages: write
  security-events: write

jobs:
  orchestrate:
    uses: blinklabs-io/actions/.github/workflows/reuseable-publish-docker-multiarch.yml@main
    secrets:
      docker-password: ${{ secrets.DOCKER_PASSWORD }}
    with:
      build-args: |-
        VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
        COMMIT_HASH=${{ github.sha }}
      description: Wrapper image for https://hub.docker.com/r/minio/minio
      docker-image: blinklabs/minio
      ghcr-image: blinklabs-io/minio
